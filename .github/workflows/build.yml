name: Linux build and QEMU baseline
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 xorriso qemu-system-x86 ovmf acpica-tools exfatprogs
      - name: Check prerequisites
        run: make check-host
      - name: Check documentation and screenshot manifest
        run: make check-docs
      - name: Offline ACPI resource and initialization audit tests
        run: |
          mkdir -p build/review
          set -o pipefail
          make test-acpi-namespace 2>&1 | tee build/review/acpi-namespace.log
      - name: Build BIOS and UEFI images
        run: |
          mkdir -p build/review
          set -o pipefail
          make -j2 all usb-image 2>&1 | tee build/review/build.log
      - name: Baseline smoke tests
        run: |
          set -o pipefail
          python3 tools/cli_smoke.py --restart-only 2>&1 | tee build/review/pipe-restart.log
          make smoke 2>&1 | tee build/review/smoke.log
      - name: Separate ACPI runtime ownership and query containment
        run: |
          set -o pipefail
          make -j2 acpi-runtime-vm-kernel 2>&1 | tee build/review/acpi-runtime-build.log
          python3 tools/acpi_runtime_smoke.py 2>&1 | tee build/review/acpi-runtime.log
          for fault in none block release-denied handoff deadline release release-sleep-denied; do
            python3 tools/acpi_global_lock_smoke.py --fault "$fault" 2>&1 | tee "build/review/acpi-global-lock-$fault.log"
          done
          python3 tools/acpi_ec_smoke.py --early-load 2>&1 | tee build/review/acpi-ec-early.log
          for fault in storm zero-storm slow; do
            python3 tools/acpi_ec_smoke.py --early-load --query-fault "$fault" 2>&1 | tee "build/review/acpi-ec-query-$fault.log"
          done
      - name: Separate native battery diagnostic and modeled failure containment
        run: |
          set -o pipefail
          make -j2 acpi-battery-kernel acpi-battery-vm-kernel test-io-scheduler test-acpi-worker test-battery-native-policy test-battery-transition test-battery-cache 2>&1 | tee build/review/acpi-battery-build.log
          python3 tools/test_hardware_boot.py
          python3 tools/test_hardware_desktop.py
          for scenario in normal denied transport storm deadline query-deadline disconnect-deadline foreign-event foreign-restore-fail foreign-mask-fail foreign-reenable mode-button mode-unexpected transitions transition-timeout native-refusal service service-stale service-incoherent service-refusal service-query-deadline service-setup-load service-auto-deadline service-sci-unclaimed service-io-short service-io-long service-io-sustained service-usb-io service-usb-read service-usb-read-auto-deadline service-usb-write service-usb-write-auto-deadline; do
            python3 tools/acpi_battery_smoke.py --case "$scenario" 2>&1 | tee "build/review/acpi-battery-$scenario.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-logs
          path: |
            build/review/*.log
            build/review/acpi-*/serial.txt
            build/review/acpi-*/qemu.txt
